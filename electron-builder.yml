# electron-builder.yml
appId: tech.ericarieldelapaz.studybuddy
productName: Study Buddy
copyright: Copyright © 2026 Eric Ariel De La Paz

directories:
  output: dist
  buildResources: resources

asar: true
asarUnpack:
  - "node_modules/get-windows/**/*"

files:
  - "out/**/*"
  - "package.json"
  - "!src/**/*"
  - "!electron.vite.config.*"
  - "!tsconfig*.json"
  - "!tailwind.config.*"
  - "!postcss.config.*"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json}"

# Windows Configuration (expects resources/icon.ico if custom icon is used)
win:
  executableName: Study-Buddy
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: "${productName}-${version}-Setup-${arch}.${ext}"
  shortcutName: "${productName}"
  uninstallDisplayName: "${productName}"
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true

# macOS Configuration (expects resources/icon.icns if custom icon is used)
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64

dmg:
  artifactName: "${productName}-${version}-${arch}.${ext}"

# Linux Configuration (expects resources/icon.png 512x512)
linux:
  category: Utility
  synopsis: Interactive desktop focus companion, reminders, and study notepad.
  target:
    - target: AppImage
      arch:
        - x64

appImage:
  artifactName: "${productName}-${version}-${arch}.${ext}"

publish:
  provider: github
  releaseType: draft
